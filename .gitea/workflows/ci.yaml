# check: on every push and PR - bot.py must at least compile.
# image: on main only - builds the Dockerfile and pushes it to the Gitea
#        registry as git.jubrlab.ch/jubr/dc_homepot:{main,<sha>}.
# Nothing is deployed from here: the bot runs on homelab-server from the
# homelab repo's dc_homepot/compose.yaml, which pins a released version
# (see release.yaml) and is updated by hand.
# Needs the user-level secret REGISTRY_TOKEN (package: Read and write).
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile bot.py

  image:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE: git.jubrlab.ch/jubr/dc_homepot
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.jubrlab.ch -u "${{ gitea.actor }}" --password-stdin
      - run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:main" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:main"
          docker push "$IMAGE:${GITHUB_SHA::7}"
      - if: always()
        run: docker logout git.jubrlab.ch
